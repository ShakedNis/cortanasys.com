<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cortana</title>
<meta name="description" content="Cortana">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-6 -6 78 78'%3E%3Crect x='-6' y='-6' width='78' height='78' fill='%23000'/%3E%3Cg fill='%23f2f2f0'%3E%3Crect x='0' y='0' width='42' height='21'/%3E%3Crect x='45' y='0' width='21' height='42'/%3E%3Crect x='0' y='24' width='21' height='42'/%3E%3Crect x='24' y='45' width='42' height='21'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400&display=swap" rel="stylesheet">
<style>
  /* Single dark look: full-bleed starfield canvas, brand lockup dead center */
  :root {
    --space: #000000;
    --ink: #ececea;
    --font-brand: "Montserrat", "Helvetica Neue", Arial, sans-serif;
    --mark: clamp(44px, 7.2vw, 84px);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--space);
    color: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  canvas#sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  main {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-inline: 16px;
  }
  .lockup {
    display: flex;
    align-items: center;
    gap: calc(var(--mark) * 0.66);
    opacity: 0;
    animation: arrive 2.4s cubic-bezier(.2,.7,.2,1) .3s forwards;
  }
  .lockup svg {
    width: var(--mark);
    height: var(--mark);
    flex: none;
    display: block;
  }
  .lockup svg rect { fill: var(--ink); }
  h1 {
    margin: 0;
    font-family: var(--font-brand);
    font-weight: 400;
    /* cap height ~0.56 of the mark, as in the original lockup */
    font-size: calc(var(--mark) * 0.78);
    line-height: 1;
    letter-spacing: 0.34em;
    margin-right: -0.34em; /* cancel trailing tracking so the lockup stays centered */
    color: var(--ink);
    white-space: nowrap;
  }
  @keyframes arrive {
    from { opacity: 0; filter: blur(6px); }
    to   { opacity: 1; filter: blur(0); }
  }
  @media (max-width: 520px) {
    :root { --mark: 40px; }
    .lockup { gap: 22px; }
    h1 { letter-spacing: 0.24em; margin-right: -0.24em; }
  }
  @media (prefers-reduced-motion: reduce) {
    .lockup { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main>
  <div class="lockup">
    <svg viewBox="0 0 66 66" role="img" aria-label="Cortana logo">
      <rect x="0"  y="0"  width="42" height="21"/>
      <rect x="45" y="0"  width="21" height="42"/>
      <rect x="0"  y="24" width="21" height="42"/>
      <rect x="24" y="45" width="42" height="21"/>
    </svg>
    <h1>CORTANA</h1>
  </div>
</main>
<script>
(function () {
  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W, H, dpr, stars = [], meteors = [], nextMeteor = 0, last = 0;

  function rand(a, b) { return a + Math.random() * (b - a); }

  function build() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var count = Math.round((W * H) / 3200);
    stars = [];
    for (var i = 0; i < count; i++) {
      var big = Math.random() < 0.08;
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: big ? rand(0.9, 1.5) : rand(0.3, 0.9),
        a: big ? rand(0.7, 1) : rand(0.25, 0.75),
        tw: rand(0.4, 1.6),          // twinkle speed
        ph: Math.random() * Math.PI * 2
      });
    }
  }

  function spawnMeteor() {
    // Always travel from the upper left toward the lower right
    var angle = rand(22, 38) * Math.PI / 180;
    var speed = rand(560, 860);      // px per second
    meteors.push({
      x: rand(-0.1 * W, 0.6 * W),
      y: rand(-0.05 * H, 0.4 * H),
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      len: rand(120, 260),
      life: 0,
      max: rand(0.9, 1.5),           // seconds
      w: rand(1.1, 1.8)
    });
  }

  function drawStars(t) {
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var a = reduce ? s.a : s.a * (0.65 + 0.35 * Math.sin(t * s.tw + s.ph));
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawMeteors(dt) {
    for (var i = meteors.length - 1; i >= 0; i--) {
      var m = meteors[i];
      m.life += dt;
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      var p = m.life / m.max;
      if (p >= 1) { meteors.splice(i, 1); continue; }
      // fade in quickly, fade out at the end
      var fade = p < 0.15 ? p / 0.15 : Math.max(0, 1 - (p - 0.15) / 0.85);
      var sp = Math.hypot(m.vx, m.vy);
      var tx = m.x - (m.vx / sp) * m.len;
      var ty = m.y - (m.vy / sp) * m.len;
      var g = ctx.createLinearGradient(m.x, m.y, tx, ty);
      g.addColorStop(0, 'rgba(255,255,255,' + (0.95 * fade) + ')');
      g.addColorStop(0.25, 'rgba(210,225,255,' + (0.45 * fade) + ')');
      g.addColorStop(1, 'rgba(180,200,255,0)');
      ctx.strokeStyle = g;
      ctx.lineWidth = m.w;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(tx, ty);
      ctx.stroke();
      // glowing head
      var hg = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, 6);
      hg.addColorStop(0, 'rgba(255,255,255,' + fade + ')');
      hg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = hg;
      ctx.beginPath();
      ctx.arc(m.x, m.y, 6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function frame(now) {
    var t = now / 1000;
    var dt = last ? Math.min(0.05, t - last) : 0;
    last = t;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    drawStars(t);
    // Only one shooting star on screen at a time
    if (t > nextMeteor && meteors.length === 0) {
      spawnMeteor();
      nextMeteor = t + rand(2.5, 5);
    }
    drawMeteors(dt);
    requestAnimationFrame(frame);
  }

  build();
  window.addEventListener('resize', build);

  if (reduce) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; drawStars(0);
    window.addEventListener('resize', function () {
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff'; drawStars(0);
    });
  } else {
    nextMeteor = 1.2;
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
